        /* Neumorphic Shadows */
        .neu-flat {
            background: #131314;
            box-shadow: 4px 4px 10px #000000, -2px -2px 6px #2A2A2B;
        }

        .neu-pressed {
            background: #131314;
            box-shadow: inset 4px 4px 10px #000000, inset -2px -2px 6px #2A2A2B;
        }

        .neu-button-raised {
            background: #131314;
            box-shadow: 4px 4px 10px #000000, -2px -2px 6px #2A2A2B;
            transition: all 0.2s ease;
        }

        .neu-button-raised:active {
            box-shadow: inset 2px 2px 5px #000000, inset -1px -1px 3px #2A2A2B;
        }

        /* Input styling overrides */
        .neu-input {
            border: none !important;
            outline: none !important;
        }
        
        .neu-input:focus {
            box-shadow: inset 4px 4px 10px #000000, inset -2px -2px 6px #2A2A2B, 0 0 0 1px #f49638 !important;
        }

        /* Hide scrollbars for clean hardware feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #131314;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A2A2B;
            border-radius: 10px;
        }

<main class="flex-grow flex flex-col items-center justify-center py-xl px-margin-mobile md:px-margin-desktop relative">

<div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-tertiary opacity-5 blur-[100px] rounded-full pointer-events-none"></div>

<div class="mb-lg">

<p class="text-secondary font-body-lg text-body-lg">Precision tool for manual peripheral cataloging.</p>
</div>
<!-- Bento Card for Form -->
<div class="neu-flat rounded-xl p-lg grid grid-cols-1 md:grid-cols-12 gap-md relative overflow-hidden">
<!-- Header Icon Accent -->
<div class="absolute -top-10 -right-10 w-40 h-40 bg-primary/5 rounded-full blur-2xl"></div>
<form class="md:col-span-12 space-y-lg relative z-10">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Product Name -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest px-xs">Product Name</label>
<input class="w-full p-md rounded-lg neu-pressed neu-input bg-background text-on-background font-body-md text-body-md" placeholder="e.g. Heptic Linear Switch MK-1" type="text">
</div>
<!-- Category -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest px-xs">Category</label>
<select class="w-full p-md rounded-lg neu-pressed neu-input bg-background text-on-background font-body-md text-body-md appearance-none">
<option>Select Category</option>
<option>Switches</option>
<option>Keycaps</option>
<option>Barebone Kits</option>
<option>Cables</option>
</select>
</div>
</div>
<!-- Description -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest px-xs">Full Description</label>
<textarea class="w-full p-md rounded-lg neu-pressed neu-input bg-background text-on-background font-body-md text-body-md resize-none" placeholder="Technical specifications and material details..." rows="4"></textarea>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Price -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest px-xs">Unit Price (USD)</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-primary font-bold">$</span>
<input class="w-full pl-lg p-md rounded-lg neu-pressed neu-input bg-background text-on-background font-body-md text-body-md" placeholder="0.00" step="0.01" type="number">
</div>
</div>
<!-- Image URL -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest px-xs">Reference Image URL</label>
<div class="relative flex items-center">
<input class="w-full p-md rounded-lg neu-pressed neu-input bg-background text-on-background font-body-md text-body-md pr-12" placeholder="https://cdn.heptic.com/assets/..." type="url">
<span class="material-symbols-outlined absolute right-md text-on-surface-variant">link</span>
</div>
</div>
</div>
<!-- Visual Feedback / Preview Area -->
<div class="pt-md">
<div class="w-full h-48 rounded-xl neu-pressed flex flex-col items-center justify-center border border-surface-variant/20 border-dashed group cursor-pointer overflow-hidden">

<span class="material-symbols-outlined">save</span>

<script>
        // Micro-interactions for form feedback
        document.querySelectorAll('.neu-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Simple button active state simulation for Neumorphism
        const saveBtn = document.querySelector('button[type="submit"]');
        saveBtn.addEventListener('mousedown', () => {
            saveBtn.style.boxShadow = 'inset 4px 4px 10px rgba(0,0,0,0.4)';
        });
        saveBtn.addEventListener('mouseup', () => {
            saveBtn.style.boxShadow = '';
        });
    </script>
